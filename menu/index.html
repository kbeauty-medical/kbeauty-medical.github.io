<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7F5F0">
<meta name="description" content="애드윤 시술 메뉴 — 눈썹 · 립 · 아이라인 · 헤어라인 · 두피문신. 배곧점 · 강남점. 한국어 · English · 中文 · 日本語.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>ADDYOON MENU — 시술 메뉴</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23242321'/%3E%3Ctext x='90' y='128' font-family='Georgia,serif' font-size='116' font-weight='400' fill='%23F3EFE8' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    color-scheme: light;
    --bg:#F7F5F0;
    --bg-soft:#F1EEE7;
    --sand:#DAD4CC;
    --ink:#242321;
    --ink-2:#57524A;
    --ink-3:#8B847A;
    --line:rgba(36,35,33,.16);
    --line-soft:rgba(36,35,33,.08);
    --dark:#242321;
    --dark-deep:#1B1A18;
    --on-dark:#EDE8DF;
    --on-dark-2:#A29B91;
    --max:46rem;
    --pad:clamp(1.15rem, 5vw, 2.6rem);
    --sans:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto,
           "Helvetica Neue", Helvetica, Arial, "Apple SD Gothic Neo", "Pretendard",
           "Noto Sans KR", "PingFang SC", "Hiragino Sans", "Yu Gothic",
           "Malgun Gothic", sans-serif;
    --lbl: .6rem;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:400;
    font-size:1rem;
    line-height:1.6;
    letter-spacing:-0.01em;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,p,dl,dd,dt,figure,ul,ol{ margin:0; }
  ul,ol{ list-style:none; padding:0; }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-appearance:none; }
  button:focus-visible, a:focus-visible{ outline:1px solid var(--ink); outline-offset:3px; }
  .num{ font-variant-numeric: tabular-nums lining-nums; }

  /* ── 상단 바 ─────────────────────────────────────────────── */
  .top{
    position:sticky; top:0; z-index:30;
    background:rgba(247,245,240,.88);
    -webkit-backdrop-filter:saturate(140%) blur(14px);
    backdrop-filter:saturate(140%) blur(14px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .top__in{
    width:min(calc(100% - var(--pad)*2), var(--max));
    margin-inline:auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:.75rem;
    min-height:3.65rem;
  }
  .brand{
    display:flex; align-items:baseline; gap:.5rem;
    font-size:.82rem; font-weight:500; letter-spacing:.2em; text-transform:uppercase;
    white-space:nowrap;
  }
  .brand i{
    font-style:normal; font-size:.58rem; font-weight:400; letter-spacing:.24em;
    color:var(--ink-3);
  }
  .langs{ display:flex; align-items:center; gap:.18rem; margin-left:auto; }
  .lang{
    display:grid; place-items:center;
    min-height:2.1rem; padding:.2rem .44rem;
    font-size:.72rem; letter-spacing:.02em; color:#6F6960;
    border:1px solid transparent;
    transition:color .18s ease, border-color .18s ease;
  }
  .lang[aria-pressed="true"]{ color:var(--ink); border-color:var(--ink); }
  .lang:not([aria-pressed="true"]):hover{ color:var(--ink); }

  /* ── 히어로 ─────────────────────────────────────────────── */
  .hero{
    width:min(calc(100% - var(--pad)*2), var(--max));
    margin-inline:auto;
    padding:clamp(2.4rem, 7vw, 4.4rem) 0 0;
  }
  .hero__lbl{
    font-size:var(--lbl); letter-spacing:.26em; text-transform:uppercase;
    color:var(--ink-3);
  }
  .hero__t{
    margin-top:.9rem;
    font-size:clamp(2rem, 8.4vw, 3rem);
    font-weight:300; line-height:1.16; letter-spacing:-0.035em;
  }
  .hero__s{
    margin-top:.85rem;
    font-size:.82rem; line-height:1.7; color:var(--ink-2);
    letter-spacing:.01em;
  }
  .hero__rule{
    height:1px; background:var(--line); margin-top:clamp(1.6rem, 4vw, 2.2rem);
  }
  .hero__note{
    margin-top:.8rem;
    font-size:.72rem; line-height:1.65; color:var(--ink-3); letter-spacing:0;
  }

  /* ── 카테고리 ───────────────────────────────────────────── */
  .menu{
    width:min(calc(100% - var(--pad)*2), var(--max));
    margin-inline:auto;
    padding-bottom:clamp(1.5rem, 4vw, 2.4rem);
  }
  .cat{ padding-top:clamp(2rem, 5vw, 2.7rem); }
  .cat__head{
    padding-bottom:.9rem;
    border-bottom:1px solid var(--line);
  }
  .cat__meta{
    display:flex; align-items:baseline; gap:.7rem;
  }
  .cat__no{
    font-size:.6rem; letter-spacing:.2em; color:var(--ink-3);
    font-variant-numeric:lining-nums;
  }
  .cat__lat{
    font-size:.56rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--ink-3);
  }
  .cat__t{
    margin-top:.5rem;
    font-size:clamp(1.16rem, 4.4vw, 1.4rem);
    font-weight:400; letter-spacing:-0.025em; line-height:1.4;
  }
  /* 한국어는 어절 단위로 끊고, 중국어 · 일본어는 기본 줄바꿈 규칙을 따른다 */
  html[lang="ko"] .cat__t,
  html[lang="ko"] .item__name,
  html[lang="ko"] .item__desc,
  html[lang="ko"] .cat__note,
  html[lang="ko"] .hero__note,
  html[lang="ko"] .note__p{ word-break:keep-all; }
  .cat__note{
    padding-top:.75rem;
    font-size:.72rem; line-height:1.65; color:var(--ink-3);
    letter-spacing:0;
  }

  /* ── 아이템(아코디언) ──────────────────────────────────── */
  .item{ border-bottom:1px solid var(--line-soft); }
  .item:last-child{ border-bottom:0; }
  .item__head, .lang{ -webkit-user-select:none; user-select:none; }
  .item__head{
    width:100%;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto 1.05rem;
    align-items:center;
    gap:.9rem;
    padding:1.12rem 0 1.05rem;
    text-align:left;
  }
  .item__name{
    font-size:clamp(1rem, 2.9vw, 1.1rem);
    font-weight:500; letter-spacing:-0.02em; line-height:1.45;
    transition:color .18s ease;
  }
  .item__price{
    display:flex; flex-direction:column; align-items:flex-end;
    gap:.16rem; text-align:right;
  }
  .p-main{
    font-size:clamp(.95rem, 2.7vw, 1.02rem);
    letter-spacing:-0.01em; line-height:1.3;
    font-variant-numeric:tabular-nums lining-nums;
    white-space:nowrap;
  }
  .p-sub{
    font-size:.68rem; letter-spacing:0;
    color:var(--ink-3); line-height:1.35;
    font-variant-numeric:tabular-nums lining-nums;
    white-space:nowrap;
  }
  .item__ico{ position:relative; width:1.05rem; height:1.05rem; }
  .item__ico::before,.item__ico::after{
    content:""; position:absolute; left:0; right:0; top:50%;
    height:1px; background:var(--ink);
    transform:translateY(-50%);
    transition:transform .34s cubic-bezier(.22,.61,.36,1), opacity .24s ease;
  }
  .item__ico::after{ transform:translateY(-50%) rotate(90deg); }
  .item.is-open .item__ico::after{ transform:translateY(-50%) rotate(0deg); }

  .item__panel{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .42s cubic-bezier(.22,.61,.36,1);
  }
  .item__panel > .item__in{ overflow:hidden; min-height:0; }
  .item.is-open .item__panel{ grid-template-rows:1fr; }

  .item__body{
    padding:.15rem 1.6rem 1.5rem .05rem;
    opacity:0; transform:translateY(-4px);
    transition:opacity .34s ease .05s, transform .34s ease .05s;
  }
  .item.is-open .item__body{ opacity:1; transform:none; }
  .item__desc{
    font-size:.9rem; line-height:1.82; color:var(--ink-2);
    letter-spacing:-0.005em;
    overflow-wrap:break-word;
  }
  .specs{
    display:flex; flex-wrap:wrap; gap:.35rem 1.35rem;
    margin-top:.9rem;
    padding-top:.75rem;
    border-top:1px solid var(--line-soft);
  }
  .specs span{ display:flex; align-items:baseline; gap:.42rem; }
  .specs em{
    font-style:normal; font-size:.56rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-3);
  }
  .specs b{
    font-weight:400; font-size:.8rem; color:var(--ink);
    font-variant-numeric:lining-nums;
    letter-spacing:0;
  }
  .item__fine{
    margin-top:.6rem;
    font-size:.66rem; line-height:1.6; color:var(--ink-3); letter-spacing:0;
  }

  /* ── 눈썹 사진 슬라이드쇼 ───────────────────────────────── */
  .gal{ margin:0 0 1.1rem; }
  .gal__stage{
    position:relative;
    width:100%;
    aspect-ratio:540 / 510;
    background:var(--bg-soft);
    overflow:hidden;
  }
  .gal__img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center;
    opacity:0;
    transition:opacity .5s cubic-bezier(.4,0,.2,1);
  }
  .gal__img.is-on{ opacity:1; }
  .gal__bar{
    display:flex; align-items:center; gap:.55rem;
    margin-top:.3rem;
  }
  .gal__dots{ display:flex; align-items:center; gap:.16rem; margin-right:auto; }
  .gal__dot{ display:block; padding:.62rem .1rem; }
  .gal__dot i{
    display:block; width:1.12rem; height:2px;
    background:rgba(36,35,33,.18);
    transition:background .22s ease;
  }
  .gal__dot[aria-current="true"] i{ background:var(--ink); }
  .gal__count{
    font-size:.6rem; letter-spacing:.06em; color:var(--ink-3);
    font-variant-numeric:tabular-nums lining-nums; white-space:nowrap;
  }
  .gal__toggle{
    display:inline-flex; align-items:center;
    min-height:1.8rem; padding:0 .52rem;
    border:1px solid var(--line);
    font-size:.64rem; letter-spacing:.02em; color:var(--ink-2);
    white-space:nowrap;
    transition:color .18s ease, border-color .18s ease;
  }
  .gal__toggle:hover{ color:var(--ink); border-color:var(--ink); }
  .gal__toggle:active{ color:var(--ink); }

  /* ── 추천 대상 ─────────────────────────────────────────── */
  .forwho{
    margin-top:1rem;
    padding-top:.85rem;
    border-top:1px solid var(--line-soft);
  }
  .forwho__t{
    font-size:.58rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-3);
  }
  .forwho__l{ margin-top:.55rem; display:grid; gap:.3rem; }
  .forwho__l li{
    position:relative; padding-left:.95rem;
    font-size:.86rem; line-height:1.6; color:var(--ink-2);
    letter-spacing:-0.005em;
    overflow-wrap:break-word;
  }
  .forwho__l li::before{
    content:""; position:absolute; left:.08rem; top:.74em;
    width:.42rem; height:1px; background:var(--ink-3);
  }

  /* ── 하단 안내 ─────────────────────────────────────────── */
  .notes{
    background:var(--bg-soft);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:clamp(2.2rem, 6vw, 3.4rem) 0;
  }
  .notes__in{
    width:min(calc(100% - var(--pad)*2), var(--max));
    margin-inline:auto;
    display:grid; gap:clamp(1.8rem, 4.5vw, 2.6rem);
  }
  .note__lbl{
    font-size:var(--lbl); letter-spacing:.26em; text-transform:uppercase;
    color:var(--ink-3);
  }
  .note__t{
    margin-top:.55rem;
    font-size:1.02rem; font-weight:500; letter-spacing:-0.02em;
  }
  .note__p{
    margin-top:.6rem;
    font-size:.86rem; line-height:1.8; color:var(--ink-2);
  }
  .branches{ margin-top:.9rem; display:grid; gap:.9rem; }
  .branch{ display:grid; grid-template-columns:5.6rem minmax(0,1fr); gap:.5rem; align-items:baseline; }
  .branch dt{
    font-size:.8rem; font-weight:500; letter-spacing:-0.01em; color:var(--ink);
  }
  .branch dd{
    font-size:.82rem; line-height:1.6; color:var(--ink-2);
    overflow-wrap:anywhere;
  }

  /* ── 푸터 ───────────────────────────────────────────────── */
  .foot{
    background:var(--dark); color:var(--on-dark);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .foot__in{
    width:min(calc(100% - var(--pad)*2), var(--max));
    margin-inline:auto;
    padding:1.7rem 0 1.55rem;
    display:flex; align-items:baseline; justify-content:space-between;
    gap:1rem;
  }
  .foot__b{
    font-size:.72rem; letter-spacing:.22em; text-transform:uppercase;
    white-space:nowrap;
  }
  .foot__t{
    font-size:.68rem; color:var(--on-dark-2); letter-spacing:.01em;
    text-align:right; line-height:1.5;
  }
  .foot__bar{
    background:var(--dark-deep);
  }
  .foot__bar .foot__in{
    padding:.8rem 0;
    font-size:.55rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--on-dark-2);
  }

  @media (max-width:420px){
    .brand{ font-size:.74rem; letter-spacing:.16em; }
    .brand i{ display:none; }
    .lang{ padding:.2rem .34rem; font-size:.7rem; min-height:1.95rem; }
    .item__body{ padding-right:.4rem; }
    .branch{ grid-template-columns:4.6rem minmax(0,1fr); }
  }
  @media (min-width:700px){
    .item__head{ padding:1.3rem 0 1.2rem; gap:1.4rem; }
    .item__body{ padding-bottom:1.7rem; }
    .gal{ max-width:27rem; }
    .notes__in{ grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
  }
  @media print{
    .top{ position:static; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top__in">
    <div class="brand">ADDYOON <i>MENU</i></div>
    <nav class="langs" aria-label="Language">
      <button type="button" class="lang" data-lang="ko" lang="ko" aria-pressed="true">한국어</button>
      <button type="button" class="lang" data-lang="en" lang="en" aria-pressed="false">EN</button>
      <button type="button" class="lang" data-lang="zh" lang="zh-Hans" aria-pressed="false">中文</button>
      <button type="button" class="lang" data-lang="ja" lang="ja" aria-pressed="false">日本語</button>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <p class="hero__lbl">ADDYOON · TREATMENT MENU</p>
    <h1 class="hero__t" data-i18n="heroTitle">시술 메뉴</h1>
    <p class="hero__s" data-i18n="heroSub">배곧 · 강남 | 반영구화장 · 아카데미</p>
    <div class="hero__rule"></div>
    <p class="hero__note" data-i18n="priceNote">* 현금으로 표시된 금액은 현금 결제 시 적용되는 할인가입니다.</p>
  </section>

  <div class="menu" id="menu"></div>

  <section class="notes">
    <div class="notes__in">
      <div class="note">
        <p class="note__lbl">RETOUCH</p>
        <h2 class="note__t" data-i18n="retouchTitle">리터치 안내</h2>
        <p class="note__p" data-i18n="retouchText">리터치는 1회 무료, 2회부터는 유료이며 시술일로부터 3개월 이내까지만 가능합니다.</p>
      </div>
      <div class="note">
        <p class="note__lbl">LOCATION</p>
        <h2 class="note__t" data-i18n="branchTitle">지점 안내</h2>
        <dl class="branches">
          <div class="branch">
            <dt data-i18n="branch1Name">배곧점</dt>
            <dd lang="ko">경기 시흥시 서울대학로278번길 19-13 A동 244호</dd>
          </div>
          <div class="branch">
            <dt data-i18n="branch2Name">강남점</dt>
            <dd lang="ko">서울 강남구 테헤란로13길 8-3 3층</dd>
          </div>
        </dl>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="foot__in">
    <span class="foot__b">ADDYOON</span>
    <span class="foot__t" data-i18n="footTag">반영구화장 · 아카데미</span>
  </div>
  <div class="foot__bar">
    <div class="foot__in"><span>© ADDYOON</span><span>BAEGOT · GANGNAM</span></div>
  </div>
</footer>

<noscript>
  <p style="padding:1.5rem;font:14px/1.6 sans-serif">이 페이지는 JavaScript가 필요합니다. / JavaScript is required.</p>
</noscript>

      note:{ ko:UI.ko.noteRange, en:UI.en.noteRange, zh:UI.zh.noteRange, ja:UI.ja.noteRange },
      items:[

          price:{ list:[{kind:"regular",amount:170000},{kind:"cash",amount:150000}] },
          desc:{
            ko:"점막을 촘촘히 채워 또렷하고 깔끔한 눈매를 만듭니다. 아이라인을 매일 그리는 번거로움을 덜고 싶으시거나, 눈매를 선명하게 정돈하고 싶으실 때 추천합니다. 눈의 형태에 맞춰 라인의 두께와 길이를 조정합니다.",

        },
        {
          id:"scalp",
          name:{ ko:"두피문신", en:"Scalp Micropigmentation", zh:"头皮纹发", ja:"頭皮アートメイク" },
          price:{ list:[{kind:"regular",amount:200000}], from:true },
          desc:{
            ko:"가르마나 정수리가 비어 보이는 부위에 도트 기법으로 모근의 밀도를 표현합니다. 헤어 커버나 볼륨 시술만으로 부족하게 느껴지실 때, 두피 라인을 자연스럽게 정돈하고 싶으실 때 추천합니다. 범위에 따라 소요 시간과 금액이 달라지며, 상담 후 확정합니다.",
            en:"A dot-work technique recreates the density of hair follicles where the parting or crown looks thin. Recommended when hair cover or volume styling no longer feels enough, or to tidy the scalp line naturally. Time and price depend on the area covered and are confirmed after consultation.",
            zh:"以点刺技法在分缝与头顶稀疏处营造毛囊密度感。适合单靠发片或蓬松造型仍显不足、希望自然修饰头皮线条的顾客。施术范围不同，时间与费用在咨询后确定。",
            ja:"分け目や頭頂部の薄さにドット技法で毛根の密度感を表現します。ヘアカバーやボリュームスタイリングだけでは物足りない方、頭皮のラインを自然に整えたい方に。範囲により所要時間と料金が変わり、カウンセリング後に確定します。"
          },
          dur:{ ko:"2–3시간", en:"2–3 hrs", zh:"2–3小时", ja:"2〜3時間" },
          hold:{ ko:"2–4년", en:"2–4 yrs", zh:"2–4年", ja:"2〜4年" }
        }
      ]
    }
  ];

  /* ── 유틸 ─────────────────────────────────────────────── */
  var menuEl = document.getElementById("menu");
  var openId = null;
  var current = "ko";

  function comma(n){
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function money(n, lang){
    return (lang === "ko" ? comma(n) + "원" : "₩" + comma(n));
  }
  function priceLines(item, lang){
    var ui = UI[lang];
    var out = [];
    item.price.list.forEach(function(p){
      if (p.kind === "cash") out.push({ main:false, text: ui.cash + " " + money(p.amount, lang) });
      else out.push({ main:true, text: money(p.amount, lang) + (item.price.from ? "~" : "") });
    });
    if (item.price.from) out.push({ main:false, text: ui.varies });
    return out;
  }
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  /* ── 렌더 ─────────────────────────────────────────────── */
  function render(lang){
    var ui = UI[lang];
    var html = "";

    CATS.forEach(function(cat){
      html += '<section class="cat">';
      html += '<div class="cat__head">' +
                '<p class="cat__meta"><span class="cat__no">' + cat.no + '</span>' +
                '<span class="cat__lat" lang="en">' + cat.latin + '</span></p>' +
                '<h2 class="cat__t">' + esc(cat.title[lang]) + '</h2>' +
              '</div>';
      if (cat.note){
        html += '<p class="cat__note">' + esc(cat.note[lang]) + '</p>';
      }
      cat.items.forEach(function(it){
        var lines = priceLines(it, lang);
        var priceHtml = lines.map(function(l){
          return '<span class="' + (l.main ? "p-main" : "p-sub") + '">' + esc(l.text) + '</span>';
        }).join("");
        var open = openId === it.id;

        var galHtml = "";
        if (it.photos){
          var dotsHtml = "";
          for (var k = 0; k < it.photos.length; k++){
            dotsHtml +=
              '<button type="button" class="gal__dot" data-i="' + k + '" aria-label="' + (k + 1) + '"><i></i></button>';
          }
          galHtml =
            '<div class="gal" data-gal="' + it.id + '">' +
              '<div class="gal__stage">' +
                '<img class="gal__img is-on" src="' + it.photos[0] + '" alt="" decoding="async">' +
                '<img class="gal__img" src="' + it.photos[1] + '" alt="" decoding="async">' +
              '</div>' +
              '<div class="gal__bar">' +
                '<div class="gal__dots">' + dotsHtml + '</div>' +
                '<span class="gal__count num">1 / ' + it.photos.length + '</span>' +
                '<button type="button" class="gal__toggle" aria-pressed="false">' + esc(ui.galPause) + '</button>' +
              '</div>' +
            '</div>';
        }

        var forwhoHtml = "";
        if (it.forwho){
          forwhoHtml =
            '<div class="forwho">' +
              '<p class="forwho__t">' + esc(ui.forwho) + '</p>' +
              '<ul class="forwho__l">' +
                it.forwho[lang].map(function(s){ return '<li>' + esc(s) + '</li>'; }).join("") +
              '</ul>' +
            '</div>';
        }

        html +=
          '<div class="item' + (open ? " is-open" : "") + '" data-id="' + it.id + '">' +
            '<button type="button" class="item__head" aria-expanded="' + (open ? "true" : "false") + '"' +
              ' aria-controls="panel-' + it.id + '" id="btn-' + it.id + '">' +
              '<span class="item__name">' + esc(it.name[lang]) + '</span>' +
              '<span class="item__price">' + priceHtml + '</span>' +
              '<span class="item__ico" aria-hidden="true"></span>' +
            '</button>' +
            '<div class="item__panel" id="panel-' + it.id + '" role="region" aria-labelledby="btn-' + it.id + '">' +
              '<div class="item__in"><div class="item__body">' +
                galHtml +
                '<p class="item__desc">' + esc(it.desc[lang]) + '</p>' +
                forwhoHtml +
                '<div class="specs">' +
                  '<span><em>' + esc(ui.specDur) + '</em><b>' + esc(it.dur[lang]) + '</b></span>' +
                  '<span><em>' + esc(ui.specHold) + '</em><b>' + esc(it.hold[lang]) + '</b></span>' +
                '</div>' +
                '<p class="item__fine">' + esc(ui.fine) + '</p>' +
              '</div></div>' +
            '</div>' +
          '</div>';
      });
      html += '</section>';
    });

    menuEl.innerHTML = html;

    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k = el.getAttribute("data-i18n");
      if (ui[k] != null) el.textContent = ui[k];
    });
    document.title = ui.title;

    var openIt = openId ? itemById(openId) : null;
    if (openIt && openIt.photos) galStart(openIt.id); else galStop();
  }

  /* ── 아이템 찾기 ───────────────────────────────────────── */
  function itemById(id){
    if (!id) return null;
    for (var i = 0; i < CATS.length; i++){
      var its = CATS[i].items;
      for (var j = 0; j < its.length; j++){
        if (its[j].id === id) return its[j];
      }
    }
    return null;
  }

  /* ── 아코디언 ─────────────────────────────────────────── */
  function toggle(id){
    if (openId === id){
      openId = null;
    } else {
      openId = id;
    }
    document.querySelectorAll(".item").forEach(function(el){
      var on = el.getAttribute("data-id") === openId;
      el.classList.toggle("is-open", on);
      var btn = el.querySelector(".item__head");
      if (btn) btn.setAttribute("aria-expanded", on ? "true" : "false");
    });
    var it = itemById(openId);
    if (it && it.photos) galStart(it.id); else galStop();
  }

  /* ── 사진 슬라이드쇼 ──────────────────────────────────── */
  var GAL_MS = 1500;
  var gId = null, gRoot = null, gImgs = null, gPhotos = null;
  var gI = 0, gLayer = 0, gPaused = false, gTimer = null;

  function galTimerOff(){
    if (gTimer){ clearInterval(gTimer); gTimer = null; }
  }
  function galTimerOn(){
    galTimerOff();
    if (!gRoot || gPaused) return;
    gTimer = setInterval(function(){
      if (!gRoot || gPaused || !gPhotos) return;
      galTo((gI + 1) % gPhotos.length);
    }, GAL_MS);
  }
  function galPaint(){
    if (!gRoot || !gImgs) return;
    var ui = UI[current];
    var it = itemById(gId);
    gImgs[0].classList.toggle("is-on", gLayer === 0);
    gImgs[1].classList.toggle("is-on", gLayer === 1);
    gImgs[gLayer].alt = (it ? it.name[current] : "") + " " + (gI + 1) + "/" + gPhotos.length;
    gImgs[1 - gLayer].alt = "";
    var dots = gRoot.querySelectorAll(".gal__dot");
    for (var k = 0; k < dots.length; k++){
      dots[k].setAttribute("aria-current", k === gI ? "true" : "false");
    }
    gRoot.querySelector(".gal__count").textContent = (gI + 1) + " / " + gPhotos.length;
    var tb = gRoot.querySelector(".gal__toggle");
    tb.textContent = ui[gPaused ? "galPlay" : "galPause"];
    tb.setAttribute("aria-pressed", gPaused ? "true" : "false");
  }
  function galTo(i){
    if (!gRoot || !gPhotos || i === gI) return;
    var layer = 1 - gLayer;
    gImgs[layer].src = gPhotos[i];
    gLayer = layer; gI = i;
    galPaint();
  }
  function galStart(id){
    var prev = (gId === id) ? { i: gI, paused: gPaused } : null;
    var it = itemById(id);
    var root = menuEl.querySelector('.gal[data-gal="' + id + '"]');
    galStop();
    if (!it || !it.photos || !root) return;
    gId = id; gRoot = root; gPhotos = it.photos;
    gImgs = root.querySelectorAll(".gal__img");
    gI = prev ? (prev.i % gPhotos.length) : 0;
    gPaused = prev ? prev.paused : false;
    gLayer = 0;
    gImgs[0].src = gPhotos[gI];
    gImgs[1].src = gPhotos[(gI + 1) % gPhotos.length];
    galPaint();
    galTimerOn();
  }
  function galStop(){
    galTimerOff();
    gId = null; gRoot = null; gImgs = null; gPhotos = null;
  }

  document.addEventListener("visibilitychange", function(){
    if (document.hidden) galTimerOff(); else galTimerOn();
  });

  menuEl.addEventListener("click", function(e){
    var tb = e.target.closest(".gal__toggle");
    if (tb){
      gPaused = !gPaused;
      if (gPaused) galTimerOff(); else galTimerOn();
      galPaint();
      return;
    }
    var dt = e.target.closest(".gal__dot");
    if (dt){
      galTo(parseInt(dt.getAttribute("data-i"), 10));
      galTimerOn();
      return;
    }
    var btn = e.target.closest(".item__head");
    if (!btn) return;
    var item = btn.closest(".item");
    if (item) toggle(item.getAttribute("data-id"));
  });

  /* ── 언어 ─────────────────────────────────────────────── */
  function setLang(lang){
    if (LANGS.indexOf(lang) < 0) lang = "ko";
    current = lang;
    document.documentElement.lang = DOCLANG[lang];
    document.querySelectorAll(".lang").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
    render(lang);
    try { localStorage.setItem("addyoon-menu-lang", lang); } catch (err) {}
  }

  var saved = null;
  try { saved = localStorage.getItem("addyoon-menu-lang"); } catch (err) {}
  var start = (saved && LANGS.indexOf(saved) >= 0) ? saved : "ko";

  document.querySelectorAll(".lang").forEach(function(b){
    b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); });
  });

  setLang(start);
})();
</script>
